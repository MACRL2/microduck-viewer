<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microduck · balance</title>
<style>
  :root { --bg: #0e1116; --fg: #e6edf3; --btn: #1f2937; --btn-fg: #e6edf3; }
  html.light { --bg: #f7f7f5; --fg: #1a1a1a; --btn: #e5e5e2; --btn-fg: #1a1a1a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; }
  button { background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; cursor: pointer; }
  button:active { transform: translateY(1px); }
  #status { position: absolute; left: 12px; top: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="status">booting…</div>
  <div id="hud">
    <button id="push">Push ↯</button>
    <button data-emote="nod">Nod</button>
    <button data-emote="shake">Shake</button>
    <button data-emote="tilt">Tilt</button>
    <button data-emote="look">Look</button>
    <button data-emote="quack">Quack 🦆</button>
    <button id="reset">Reset</button>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/addons/"
} }
</script>
<script type="module">
  import * as THREE from 'three';
  import { createViewer } from '../src/core.js';
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.documentElement.classList.add('light');
  // The host page can pass its exact background via ?bg=%23rrggbb so the canvas
  // (and ground/fog) blends into the page; otherwise fall back to our own theme.
  const bg = params.get('bg') || getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (params.get('bg')) document.documentElement.style.setProperty('--bg', bg);
  const status = document.getElementById('status');
  // Optional scene obstacles: ?scene=lip|box|step (+ &h=<metres> to set height).
  function presetScene(name) {
    const h = parseFloat(params.get('h'));
    const hz = ((isFinite(h) && h > 0) ? h : { lip: 0.04, box: 0.06, step: 0.06 }[name] || 0.04) / 2;
    if (name === 'lip') return [{ pos: [0.24, 0, hz], size: [0.03, 0.18, hz] }];
    if (name === 'box') return [{ pos: [0.20, 0.10, hz], size: [0.03, 0.03, hz] }];
    if (name === 'step') return [{ pos: [0.32, 0, hz], size: [0.16, 0.24, hz] }];
    return [];
  }
  const scene = params.get('scene') ? presetScene(params.get('scene')) : [];
  const viewer = await createViewer({
    canvas: document.getElementById('c'),
    background: new THREE.Color(bg).getHex(),
    // a scene reads best over a real floor, so default ground to 'plane' when present
    ground: params.get('ground') || (scene.length ? 'plane' : 'circle'),
    scene,
    onStatus: (m) => { status.textContent = m; if (m === 'ready') status.style.display = 'none'; },
  });
  document.getElementById('push').onclick = () => viewer.push(
    (Math.random() * 2 - 1) * 0.9, (Math.random() * 2 - 1) * 0.9);
  document.querySelectorAll('[data-emote]').forEach((b) => { b.onclick = () => viewer.emote(b.dataset.emote); });
  document.getElementById('reset').onclick = () => viewer.reset();
  // Accept push/reset/theme over postMessage so a host page can drive it.
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'microduck:push') viewer.push();
    else if (d.type === 'microduck:reset') viewer.reset();
    else if (d.type === 'microduck:emote') viewer.emote(d.value || 'random');
    else if (d.type === 'microduck:theme') {
      document.documentElement.classList.toggle('light', d.value === 'light');
      const c = d.bg || getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      document.documentElement.style.setProperty('--bg', c);
      viewer.setBackground(new THREE.Color(c).getHex());
    }
  });
  viewer.start();
  window.__viewer = viewer;   // for the headless smoke
</script>
</body>
</html>
